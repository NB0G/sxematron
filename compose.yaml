services:
  schematic:
    build: .
    image: gost-schematic:local
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - library-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${CPU_LIMIT:-2}"
    mem_limit: "${MEMORY_LIMIT:-2g}"
    stop_grace_period: 20s
volumes:
  library-data:
